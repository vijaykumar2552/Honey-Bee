<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} — HoneyChain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0b1220;
            color: #f3f4f6;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .card-shell {
            background: #131c2e; border: 1px solid #22304a; border-radius: 1rem;
            padding: 2.5rem; max-width: 480px; text-align: center;
        }
        .code { font-size: 3.5rem; font-weight: 800; color: #f59e0b; line-height: 1; }
    </style>
</head>
<body>
    <div class="card-shell">
        <div class="code">{{ code }}</div>
        <p class="mt-3 mb-4 text-secondary">{{ message }}</p>
        <a href="/" class="btn btn-warning fw-semibold">Back to the dashboard</a>
    </div>
</body>
</html>
